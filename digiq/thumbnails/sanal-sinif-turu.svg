  <!-- Robi -->
  <g transform="translate(430,190)">
    <ellipse cx="0" cy="64" rx="30" ry="7" fill="#000" opacity="0.25"/>
    <rect x="-22" y="8" width="44" height="52" rx="16" fill="#8b5cf6"/>
    <rect x="-16" y="-22" width="32" height="30" rx="11" fill="#a78bfa"/>
    <circle cx="-7" cy="-8" r="4.5" fill="#fff"/>
    <circle cx="7" cy="-8" r="4.5" fill="#fff"/>
    <circle cx="-7" cy="-8" r="2" fill="#1e293b"/>
    <circle cx="7" cy="-8" r="2" fill="#1e293b"/>
