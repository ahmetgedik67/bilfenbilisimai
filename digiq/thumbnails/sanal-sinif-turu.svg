  <rect x="420" y="128" width="46" height="18" rx="4" fill="#1e6b45"/>
  <text x="443" y="141" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">KURALLAR</text>
  <rect x="270" y="205" width="100" height="10" rx="4" fill="#6b4a2b"/>

  <!-- öğretmen masası -->
  <rect x="70" y="228" width="120" height="14" rx="4" fill="#8b5e34"/>
  <rect x="80" y="242" width="10" height="34" fill="#6b4a2b"/>
  <rect x="168" y="242" width="10" height="34" fill="#6b4a2b"/>
  <rect x="96" y="208" width="34" height="22" rx="3" fill="#1e293b"/>
  <rect x="108" y="202" width="10" height="7" rx="2" fill="#334155"/>

