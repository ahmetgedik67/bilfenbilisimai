    <rect x="360" y="286" width="80" height="12" rx="3"/>
    <rect x="240" y="322" width="80" height="14" rx="3"/>
    <rect x="400" y="322" width="80" height="14" rx="3"/>
  </g>
  <g fill="#1e293b">
    <rect x="216" y="268" width="34" height="18" rx="3"/>
    <rect x="376" y="268" width="34" height="18" rx="3"/>
    <rect x="258" y="303" width="38" height="19" rx="3"/>
    <rect x="418" y="303" width="38" height="19" rx="3"/>
