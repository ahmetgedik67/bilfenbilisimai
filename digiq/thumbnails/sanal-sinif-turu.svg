<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.45" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a58b6f"/>
      <stop offset="1" stop-color="#7c6650"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5a1e"/>
      <stop offset="1" stop-color="#24491a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="90" fill="#f59e0b" opacity="0.22"/>
  <circle cx="580" cy="350" r="80" fill="#22d3ee" opacity="0.2"/>

  <!-- oda: zemin -->
  <polygon points="90,270 550,270 620,390 20,390" fill="url(#floor)"/>
  <!-- arka duvar -->
  <rect x="90" y="70" width="460" height="200" fill="#e8dcc8"/>
  <rect x="90" y="70" width="460" height="200" fill="none" stroke="#c9b896" stroke-width="4"/>
  <!-- yan duvarlar (perspektif) -->
  <polygon points="90,70 20,110 20,390 90,270" fill="#c9b896"/>
  <polygon points="550,70 620,110 620,390 550,270" fill="#e0d4c0"/>

  <!-- tahta -->
  <rect x="150" y="105" width="340" height="95" rx="6" fill="#6b4a2b"/>
  <rect x="160" y="113" width="320" height="79" rx="4" fill="url(#board)"/>
