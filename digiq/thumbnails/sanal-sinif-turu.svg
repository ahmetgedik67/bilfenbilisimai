  <!-- başlık şeridi -->
  <rect x="0" y="0" width="640" height="58" fill="#0f172a" opacity="0.55"/>
  <text x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">🏫 Sanal Sınıf Turu</text>
  <text x="616" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#c7d2fe" text-anchor="end">360° keşfet</text>
