<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilfen DigiQuest — Yeni Adres</title>
<link rel="icon" type="image/png" href="digiq/robi.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: linear-gradient(160deg, #eef6ff 0%, #f7f2ff 55%, #fff7ec 100%);
    color: #1e293b;
    padding: 24px;
  }
  .kart {
    max-width: 440px; width: 100%;
    background: rgba(255, 255, 255, .93);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(30, 64, 175, .16), 0 4px 14px rgba(30, 64, 175, .07);
    padding: 44px 32px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .kart::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 6px;
    background: linear-gradient(90deg, #2563eb, #7c3aed 35%, #ec4899 68%, #f59e0b);
  }
  .robi {
    width: 88px; height: 88px; margin: 0 auto 16px;
    border-radius: 26px; display: block;
    background: #fff;
    box-shadow: 0 10px 24px rgba(49, 46, 129, .18), inset 0 0 0 1px rgba(37, 99, 235, .08);
    object-fit: contain;
  }
  h1 {
    font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(90deg, #1e3a8a, #6d28d9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: #1e3a8a;
    margin-bottom: 10px;
  }
  p.aciklama { color: #52627f; font-size: .95rem; line-height: 1.6; margin-bottom: 24px; }
  .dugme {
    display: inline-block;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; text-decoration: none;
    font-weight: 800; font-size: 1rem;
    padding: 14px 30px; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, .32);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .dugme:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 26px rgba(37, 99, 235, .4); }
  .dugme:active { transform: translateY(0); }
  .adres {
    margin-top: 18px;
    font-size: .82rem; font-weight: 700; letter-spacing: .4px;
    color: #64748b;
  }
  .adres a { color: #2563eb; text-decoration: none; }
  .adres a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="kart">
    <img class="robi" src="digiq/robi.png" alt="Robi maskotu">
    <h1>Bilfen DigiQuest</h1>
    <p class="aciklama">Bilişim Teknolojileri Etkileşimli Öğrenme Platformu taşındı.<br>
    Yeni adresine devam etmek için <strong>tıklayın</strong>.</p>
    <a class="dugme" href="digiq/">Bilfen DigiQuest'e Git →</a>
    <p class="adres">Yeni adres: <a href="digiq/">bilfen.github.io/digiq</a></p>
  </main>
</body>
</html>
